name: AC02 gosu remediation and native provenance
on:
  push:
    branches: ["review/ac02-gosu-native-ac51f91"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ac51f91cfc08dadae3a3bb411908b0b9a26f11af
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: false
      - name: Search exact wheel provenance
        run: |
          mkdir -p audit
          uv python install
          uv sync --locked
          .venv/bin/python - <<'PY'
          import hashlib,importlib.metadata as md,json,urllib.request,urllib.error,zipfile,sysconfig
          from pathlib import Path
          root=Path("audit/provenance")
          root.mkdir(parents=True,exist_ok=True)
          data=json.load(urllib.request.urlopen("https://pypi.org/pypi/psycopg-binary/3.3.8/json",timeout=60))
          f=next(x for x in data["urls"] if "cp312-cp312-manylinux2014_x86_64" in x["filename"])
          raw=urllib.request.urlopen(f["url"],timeout=90).read()
          digest=hashlib.sha256(raw).hexdigest()
          assert digest==f["digests"]["sha256"]=="a7cdba018e4decf3837793c1e18dbe3dd71709adef54892ab83d81c00e866dc3"
          wheel=root/f["filename"]
          wheel.write_bytes(raw)
          installed=Path(sysconfig.get_paths()["purelib"])
          checks=[]
          with zipfile.ZipFile(wheel) as z:
              names=z.namelist()
              sboms=[n for n in names if any(k in n.lower() for k in ("sbom","cyclonedx","spdx","attestation","provenance"))]
              for name in names:
                  if name.startswith("psycopg_binary.libs/") and not name.endswith("/"):
                      actual=(installed/name).read_bytes()
                      expected=z.read(name)
                      assert actual==expected,name
                      checks.append({"file":name,"sha256":hashlib.sha256(actual).hexdigest()})
          result={"wheel":f,"actual_sha256":digest,"archive_files":names,"sbom_files":sboms,"native_hash_matches":checks,"lookups":[]}
          urls=[
          "https://pypi.org/integrity/psycopg-binary/3.3.8/"+f["filename"]+"/provenance",
          "https://api.github.com/repos/psycopg/psycopg/attestations/sha256:"+digest,
          "https://api.github.com/repos/psycopg/psycopg/releases/tags/3.3.8"]
          for i,url in enumerate(urls):
              req=urllib.request.Request(url,headers={"User-Agent":"DeepTradeSystem-audit","Accept":"application/json"})
              try:
                  response=urllib.request.urlopen(req,timeout=60)
                  status=response.status
                  body=response.read()
              except urllib.error.HTTPError as e:
                  status=e.code
                  body=e.read()
              (root/f"lookup-{i}.json").write_bytes(body)
              result["lookups"].append({"url":url,"status":status})
          (root/"result.json").write_text(json.dumps(result,indent=2))
          print("PROVENANCE_SUMMARY",json.dumps({"native_hash_matches":len(checks),"sbom_files":sboms,"lookups":result["lookups"]}))
          PY
      - name: Rebuild pinned gosu with current Go
        run: |
          set -euo pipefail
          base='postgres@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7'
          docker pull --platform linux/amd64 "$base"
          docker pull --platform linux/amd64 golang:1.27-alpine3.24
          docker image inspect golang:1.27-alpine3.24 > audit/go-builder.json
          builder=$(docker image inspect --format '{{index .RepoDigests 0}}' golang:1.27-alpine3.24)
          echo "$builder" > audit/go-builder-digest.txt
          mkdir -p audit/gosu-source
          curl -fsSL https://github.com/tianon/gosu/archive/29b939aa5bd4dc588af765b8248f6e39150d2565.tar.gz -o audit/gosu-source.tar.gz
          tar xzf audit/gosu-source.tar.gz --strip-components=1 -C audit/gosu-source
          sha256sum audit/gosu-source.tar.gz > audit/gosu-source-sha256.txt
          docker run --rm -v "$PWD/audit/gosu-source:/src" -v "$PWD/audit:/output" -w /src "$builder" sh -ec 'go version > /output/go-version.txt; go mod verify; CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /output/gosu .; go version -m /output/gosu > /output/gosu-build-info.txt'
          sha256sum audit/gosu > audit/gosu-sha256.txt
          printf 'ARG BASE\nFROM ${BASE}\nCOPY gosu /usr/local/bin/gosu\nRUN chmod 0755 /usr/local/bin/gosu && gosu nobody id\n' > audit/Dockerfile
          docker build --build-arg BASE="$base" -t local/ac02-gosu:ac51f91 audit
          docker image inspect local/ac02-gosu:ac51f91 > audit/corrected-image.json
          docker save local/ac02-gosu:ac51f91 -o audit/corrected-image.tar
          docker run --rm --entrypoint gosu local/ac02-gosu:ac51f91 --version | tee audit/gosu-version.txt
      - name: Audit corrected image
        run: |
          docker pull aquasec/trivy:0.76.2
          docker image inspect aquasec/trivy:0.76.2 > audit/scanner.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/audit:/output" aquasec/trivy:0.76.2 image --scanners vuln --format json --output /output/corrected-trivy.json local/ac02-gosu:ac51f91
          .venv/bin/python - <<'PY'
          import json,collections
          from pathlib import Path
          d=json.loads(Path("audit/corrected-trivy.json").read_text())
          findings=[{"target":r["Target"],**v} for r in d.get("Results",[]) for v in r.get("Vulnerabilities",[])]
          Path("audit/corrected-findings.json").write_text(json.dumps(findings,indent=2))
          print("CORRECTED_SUMMARY",json.dumps({"total":len(findings),"severity":dict(collections.Counter(v["Severity"] for v in findings)),"high_critical":[{"id":v["VulnerabilityID"],"package":v["PkgName"],"fixed":v.get("FixedVersion")} for v in findings if v["Severity"] in ("HIGH","CRITICAL")]}))
          PY
      - name: Integration against exact corrected image
        env:
          TRADE_SYSTEM_ENVIRONMENT: PAPER
          LIVE_ENABLED: "false"
          RUN_POSTGRES_TESTS: "1"
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          image=$(docker image inspect --format '{{.Id}}' local/ac02-gosu:ac51f91)
          echo "$image" > audit/corrected-image-id.txt
          printf 'services:\n  postgres:\n    image: "%s"\n    pull_policy: never\n' "$image" > audit/compose.yml
          compose=(docker compose -p corrected-gosu -f deploy/compose/postgres.yml -f audit/compose.yml)
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" up -d --pull never --wait --wait-timeout 60
          id=$("${compose[@]}" ps -q postgres)
          docker inspect --format '{{.Image}}' "$id" > audit/running-image-id.txt
          test "$(cat audit/running-image-id.txt)" = "$image"
          uv run --no-sync pytest tests/integration 2>&1 | tee audit/integration.log
      - name: Preserve artifacts
        if: always()
        run: find audit -type f -print0 | sort -z | xargs -0 sha256sum > audit-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ac02-gosu-native-ac51f91
          path: |
            audit/
            audit-SHA256SUMS
