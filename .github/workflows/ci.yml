name: Bootstrap Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src infrastructure apps tests
      - run: uv run --no-sync ruff format --check src infrastructure apps tests
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest
      - run: uv build --no-sources
      - name: Test PostgreSQL migrations, events and API readiness
        shell: bash
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          export TRADE_SYSTEM_ENVIRONMENT=PAPER LIVE_ENABLED=false
          export RUN_POSTGRES_TESTS=1
          compose=(docker compose -p deeptrade-ci -f deploy/compose/postgres.yml)
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" up -d --wait --wait-timeout 60
          uv run --no-sync pytest tests/integration
