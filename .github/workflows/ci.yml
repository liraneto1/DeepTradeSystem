name: PostgreSQL gosu metadata rebuild

on:
  push:
    branches: [review/postgres-gosu-metadata-a26c0a8]

permissions:
  contents: read
  actions: read

jobs:
  paired-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: a26c0a86ade2ec64d14c4bb06e27c93b2aea5205
      LIVE_ENABLED: "false"
      TRADE_SYSTEM_ENVIRONMENT: PAPER
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rebuild metadata and verify client server pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/postgres_revalidation/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: postgres-gosu-metadata-a26c0a8
          path: ${{ runner.temp }}/server-pair/
          include-hidden-files: true
          if-no-files-found: error
