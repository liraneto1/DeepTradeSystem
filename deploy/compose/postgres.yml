name: deeptrade-local

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: trade_system
      POSTGRES_DB: trade_system
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U trade_system -d trade_system"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
