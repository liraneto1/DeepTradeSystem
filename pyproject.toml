[project]
name = "deep-trade-system"
version = "0.1.0"
description = "Modular foundation for Trade System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.140,<7",
    "jsonschema[format-nongpl]>=4.26,<5",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "types-jsonschema>=4.26,<5",
]

[tool.uv]
required-version = "==0.9.26"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_system"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "infrastructure", "apps", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
